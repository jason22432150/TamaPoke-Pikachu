name: StackChan fixed candidate ELF audit
on:
  push:
    branches: [stackchan]
    paths:
      - .github/workflows/stackchan-candidate-audit.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1.1
    steps:
      # Use archived build inputs, not new binaries from a rebuild.
      - uses: actions/download-artifact@v4
        with:
          name: stackchan-K151-game-compile-evidence-NOT-FOR-FLASH
          github-token: ${{ github.token }}
          run-id: 45945886585
          path: /tmp/k151-review/app
      - uses: actions/download-artifact@v4
        with:
          name: stackchan-source-bootloader-NOT-FOR-FLASH
          github-token: ${{ github.token }}
          run-id: 45945886585
          path: /tmp/k151-review/boot
      - uses: actions/download-artifact@v4
        with:
          name: stackchan-alpha-0.1.0-source-bootloader-NOT-FOR-FLASH
          github-token: ${{ github.token }}
          run-id: 45945886585
          path: /tmp/k151-review/paired
      - name: Verify fixed source and artifact identity
        shell: bash
        run: |
          cd /tmp/k151-review
          sha256sum -c <<'HASHES'
          c8799332582aacef0c856f481afb3b6c158f9ea4c8762cf9a664d4640bcfae72  boot/bootloader.elf
          89a958cdeb364677fb217072750fe3b6c2c7ca00e6bf8d5fb6398ff2696316d8  boot/bootloader.bin
          796cd0b9490b6ea13b57a28eadd10d2b272f88ac8924eb2eb1ff1eebfa380b58  boot/sdkconfig
          58fe61ac2b2f77996a5c6acd7cc79dcb4c4138e39d91b7190ef2d4a90a6c16a4  boot/bootloader-sdkconfig.h
          6ee964f685c6d6b824bf3268cb9e801c2b29200874d4071ae7d88e01fd5173f4  app/TamaPoke.ino.elf
          18c3213af1bd2edb0753d68a7c74c1da86cd0ef9ce860745d04d84146bcee9e4  app/TamaPoke.ino.map
          a635f5a6c6f64e1fbc2d7de36d58269d145f70e272220205445dd8b45c9f2035  app/sdkconfig
          4a8a63d4166d8d058389cc469519c6f0ccae315a6939cadaae64e6c7f0532ea5  paired/TamaPoke.ino.bin
          89a958cdeb364677fb217072750fe3b6c2c7ca00e6bf8d5fb6398ff2696316d8  paired/TamaPoke.ino.bootloader.bin
          48da0866f56d9d8eb1fe786412984d8f1a4a01b3f13f965621fcb916761e1a4b  paired/TamaPoke.ino.partitions.bin
          7d2c7ac4888bfd75cd5f56e8d61f69595121183afc81556c876732fd3782c62f  paired/ota_data_initial.bin
          HASHES
          python3 - <<'PY'
          import json
          from pathlib import Path
          commit="d830ac15cc1761aa421b33035ccfa0bb5f93fd1c"
          for p in ("boot/manifest.json","app/boot-evidence.json","paired/manifest.json"):
              d=json.loads(Path(p).read_text())
              if d["source_commit"]!=commit or d["flash_authorized"] is not False:
                  raise SystemExit("unexpected audit input: "+p)
          PY
      - name: Disassemble exact ELF files and extract complete eFuse reference functions
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$IDF_PATH"
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = 051e4c4eb20346e043cdd47bc388fde75ff8af63
          source "$IDF_PATH/export.sh"
          cd /tmp/k151-review
          mkdir report
          xtensa-esp32s3-elf-objdump --version | head -n 1
          for spec in boot/bootloader.elf app/TamaPoke.ino.elf; do
            name=${spec%%/*}
            xtensa-esp32s3-elf-objdump -d --no-show-raw-insn "$spec" > "report/$name.disassembly.txt"
            xtensa-esp32s3-elf-nm --defined-only --format=posix "$spec" > "report/$name.symbols.txt"
          done
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          inputs=(
              ("boot", "boot/manifest.json","bootloader_efuse_symbols"),
              ("app", "app/boot-evidence.json","application_efuse_symbols"))
          result={"source_commit":"d830ac15cc1761aa421b33035ccfa0bb5f93fd1c",
                  "flash_authorized":False,"safety_attested":False,"images":{}}
          for name,source,key in inputs:
              evidence=json.loads(Path(source).read_text())[key]
              if evidence["linked_code_symbols"] or evidence["rom_references"]["direct_references"] or evidence["rom_references"]["address_literals"]:
                  raise SystemExit("unexpected known eFuse writer references in "+name)
              wanted=set()
              for literal in evidence["mmio_screen"]["literal_context"]:
                  for load in literal["explicit_literal_loads"]:
                      wanted.add(int(load["instruction_address"],16))
              seen=set();functions=[];label=None;body=[];matched=False
              def finish():
                  if label is not None and (matched or re.search(r"efuse|rtc_init|initArduino",label,re.I)):
                      functions.append(label+"\n"+"\n".join(body))
              for line in Path(f"report/{name}.disassembly.txt").read_text().splitlines():
                  m=re.match(r"^\s*[0-9a-fA-F]+ <(.+)>:$",line)
                  if m:
                      finish()
                      label=line;body=[];matched=False
                  else:
                      body.append(line)
                      a=re.match(r"^\s*([0-9a-fA-F]+):",line)
                      if a and int(a[1],16) in wanted:
                          seen.add(int(a[1],16));matched=True
              finish()
              if seen!=wanted or not wanted or not functions:
                  raise SystemExit("could not locate all known eFuse references in "+name)
              Path(f"report/{name}.efuse-functions.txt").write_text("\n\n".join(functions)+"\n")
              # Emit the full known-reference functions to the review log as
              # well as the artifact, allowing inspection without rebuilding.
              print("BEGIN COMPLETE EFUSE FUNCTIONS "+name)
              print("\n\n".join(functions))
              print("END COMPLETE EFUSE FUNCTIONS "+name)
              result["images"][name]={"known_reference_count":len(wanted),
                                      "complete_function_count":len(functions)}
          print(json.dumps(result,indent=2))
          Path("report/audit.json").write_text(json.dumps(result,indent=2)+"\n")
          PY
      - name: Inspect linked K151 boost startup paths
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          cd /tmp/k151-review
          xtensa-esp32s3-elf-nm -C --defined-only app/TamaPoke.ino.elf > report/app.demangled-symbols.txt
          python3 - <<'PY'
          import json,re,struct
          from pathlib import Path
          elf=Path("app/TamaPoke.ino.elf").read_bytes()
          image=Path("paired/TamaPoke.ino.bin").read_bytes()
          marker=b"K151 boost init I2C failed; startup stopped"
          if marker not in elf or marker not in image:
              raise SystemExit("K151 boost failure marker missing in ELF or app")
          names=Path("report/app.demangled-symbols.txt").read_text().splitlines()
          for label in ("M5GFX::autodetect(", "Power_Class::begin("):
              matches=[s for s in names if label in s]
              if not matches:raise SystemExit("linked startup symbol missing: "+label)
              print(label, *matches[:12], sep="\n")
          # Retain entire startup and any separately linked policy functions.
          # Compiler may inline templates, so lack of a named template alone
          # is not treated as proof of missing implementation.
          blocks=[];label="";body=[]
          def finish():
              if re.search(r"M5GFX10autodetect|Power_Class5begin|tpkboost",label):
                  blocks.append((label,body[:]))
          for line in Path("report/app.disassembly.txt").read_text().splitlines():
              if re.match(r"^\s*[0-9a-fA-F]+ <.+>:$",line):
                  finish();label=line;body=[]
              else:body.append(line)
          finish()
          for name in ("M5GFX10autodetect","Power_Class5begin"):
              if not any(name in label for label,_ in blocks):
                  raise SystemExit("startup disassembly range missing: "+name)
          Path("report/app.boost-startup-functions.txt").write_text(
              "\n\n".join(label+"\n"+"\n".join(lines) for label,lines in blocks)+"\n")
          for label,lines in blocks:
              print("BOOST RANGE",label,"lines",len(lines))
              relevant=[line for line in lines if re.search(
                  r"tpkboost|delayMicroseconds|writeRegister8|readRegister8|bitOn|bitOff",line)]
              print("\n".join(relevant[:100]))
          recovery=struct.pack("<20I",30000,25000,20000,16000,13000,10000,8000,6000,
                               5000,4000,3000,2500,2000,1500,1200,1000,800,600,400,300)
          report=dict(marker_in_elf=True,marker_in_app=True,
                      recovery_table_in_elf=recovery in elf,
                      recovery_table_in_app=recovery in image,
                      extracted_ranges=len(blocks),electrical_safety_attested=False,
                      flash_authorized=False)
          print(json.dumps(report,indent=2))
          Path("report/boost-audit.json").write_text(json.dumps(report,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stackchan-d830ac1-exact-ELF-disassembly-NOT-FOR-FLASH
          path: /tmp/k151-review/report/
          if-no-files-found: error
          retention-days: 14
