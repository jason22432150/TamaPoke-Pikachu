name: StackChan fixed candidate ELF audit
on:
  push:
    branches: [stackchan]
    paths:
      - .github/workflows/stackchan-candidate-audit.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1.1
    steps:
      # Use archived build inputs, not new binaries from a rebuild.
      - uses: actions/download-artifact@v4
        with:
          name: stackchan-K151-game-compile-evidence-NOT-FOR-FLASH
          github-token: ${{ github.token }}
          run-id: 45998796326
          path: /tmp/k151-review/app
      - uses: actions/download-artifact@v4
        with:
          name: stackchan-source-bootloader-NOT-FOR-FLASH
          github-token: ${{ github.token }}
          run-id: 45998796326
          path: /tmp/k151-review/boot
      - uses: actions/download-artifact@v4
        with:
          name: stackchan-alpha-0.1.0-source-bootloader-NOT-FOR-FLASH
          github-token: ${{ github.token }}
          run-id: 45998796326
          path: /tmp/k151-review/paired
      - name: Verify fixed source and artifact identity
        shell: bash
        run: |
          cd /tmp/k151-review
          sha256sum -c <<'HASHES'
          4380ce7b750b3324e5efa6ae53caefbf8721e4b3e36be497b7a5d3b989336cc9  boot/bootloader.elf
          225c3addcce44aea056a1f37c2497cf69c157f0c5ab95c0409bd6a9e253fae19  boot/bootloader.bin
          796cd0b9490b6ea13b57a28eadd10d2b272f88ac8924eb2eb1ff1eebfa380b58  boot/sdkconfig
          58fe61ac2b2f77996a5c6acd7cc79dcb4c4138e39d91b7190ef2d4a90a6c16a4  boot/bootloader-sdkconfig.h
          3218388a3c6b26ae5551b6c2a0ac41fc012741ed0b873cc974d505cc46e9c966  app/TamaPoke.ino.elf
          12cea4019a83f9082b96fdd9510a0c3d65ada961e32acf8bd7e5e2ff67941b04  app/TamaPoke.ino.map
          a635f5a6c6f64e1fbc2d7de36d58269d145f70e272220205445dd8b45c9f2035  app/sdkconfig
          d7eb8ad05252e5d7be92ae62d2150c0f3abaefa82371c39b6afd523b6cc2f4ad  paired/TamaPoke.ino.bin
          225c3addcce44aea056a1f37c2497cf69c157f0c5ab95c0409bd6a9e253fae19  paired/TamaPoke.ino.bootloader.bin
          48da0866f56d9d8eb1fe786412984d8f1a4a01b3f13f965621fcb916761e1a4b  paired/TamaPoke.ino.partitions.bin
          7d2c7ac4888bfd75cd5f56e8d61f69595121183afc81556c876732fd3782c62f  paired/ota_data_initial.bin
          HASHES
          python3 - <<'PY'
          import json
          from pathlib import Path
          commit="6d1b2183e6717bcde9b905178826a0f06d6bd584"
          for p in ("boot/manifest.json","app/boot-evidence.json","paired/manifest.json"):
              d=json.loads(Path(p).read_text())
              if d["source_commit"]!=commit or d["flash_authorized"] is not False:
                  raise SystemExit("unexpected audit input: "+p)
          PY
      - name: Disassemble exact ELF files and extract complete eFuse reference functions
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$IDF_PATH"
          test "$(git -C "$IDF_PATH" rev-parse HEAD)" = 051e4c4eb20346e043cdd47bc388fde75ff8af63
          source "$IDF_PATH/export.sh"
          cd /tmp/k151-review
          mkdir report
          xtensa-esp32s3-elf-objdump --version | head -n 1
          for spec in boot/bootloader.elf app/TamaPoke.ino.elf; do
            name=${spec%%/*}
            xtensa-esp32s3-elf-objdump -d --no-show-raw-insn "$spec" > "report/$name.disassembly.txt"
            xtensa-esp32s3-elf-nm --defined-only --format=posix "$spec" > "report/$name.symbols.txt"
          done
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          inputs=(
              ("boot", "boot/manifest.json","bootloader_efuse_symbols"),
              ("app", "app/boot-evidence.json","application_efuse_symbols"))
          result={"source_commit":"6d1b2183e6717bcde9b905178826a0f06d6bd584",
                  "flash_authorized":False,"safety_attested":False,"images":{}}
          for name,source,key in inputs:
              evidence=json.loads(Path(source).read_text())[key]
              if evidence["linked_code_symbols"] or evidence["rom_references"]["direct_references"] or evidence["rom_references"]["address_literals"]:
                  raise SystemExit("unexpected known eFuse writer references in "+name)
              wanted=set()
              for literal in evidence["mmio_screen"]["literal_context"]:
                  for load in literal["explicit_literal_loads"]:
                      wanted.add(int(load["instruction_address"],16))
              seen=set();functions=[];label=None;body=[];matched=False
              def finish():
                  if label is not None and (matched or re.search(r"efuse|rtc_init|initArduino",label,re.I)):
                      functions.append(label+"\n"+"\n".join(body))
              for line in Path(f"report/{name}.disassembly.txt").read_text().splitlines():
                  m=re.match(r"^\s*[0-9a-fA-F]+ <(.+)>:$",line)
                  if m:
                      finish()
                      label=line;body=[];matched=False
                  else:
                      body.append(line)
                      a=re.match(r"^\s*([0-9a-fA-F]+):",line)
                      if a and int(a[1],16) in wanted:
                          seen.add(int(a[1],16));matched=True
              finish()
              if seen!=wanted or not wanted or not functions:
                  raise SystemExit("could not locate all known eFuse references in "+name)
              Path(f"report/{name}.efuse-functions.txt").write_text("\n\n".join(functions)+"\n")
              # Emit the full known-reference functions to the review log as
              # well as the artifact, allowing inspection without rebuilding.
              print("BEGIN COMPLETE EFUSE FUNCTIONS "+name)
              print("\n\n".join(functions))
              print("END COMPLETE EFUSE FUNCTIONS "+name)
              result["images"][name]={"known_reference_count":len(wanted),
                                      "complete_function_count":len(functions)}
          print(json.dumps(result,indent=2))
          Path("report/audit.json").write_text(json.dumps(result,indent=2)+"\n")
          PY
      - name: Inspect B11n retained memory and linked diagnostic paths
        shell: bash
        run: |
          set -euo pipefail
          source "$IDF_PATH/export.sh"
          cd /tmp/k151-review
          xtensa-esp32s3-elf-readelf -W -S -s -l app/TamaPoke.ino.elf > report/app.elf-layout.txt
          xtensa-esp32s3-elf-nm -C -S --defined-only app/TamaPoke.ino.elf > report/app.demangled-symbols.txt
          python3 - <<'PY'
          import json,re,struct
          from pathlib import Path
          elf=Path("app/TamaPoke.ino.elf").read_bytes()
          image=Path("paired/TamaPoke.ino.bin").read_bytes()
          if elf[:6]!=b"\x7fELF\x01\x01":raise SystemExit("unexpected ELF format")
          shoff=struct.unpack_from("<I",elf,32)[0]
          shentsize,shnum,shstrndx=struct.unpack_from("<HHH",elf,46)
          sections=[struct.unpack_from("<10I",elf,shoff+i*shentsize) for i in range(shnum)]
          def section_bytes(s):return elf[s[4]:s[4]+s[5]]
          strings=section_bytes(sections[shstrndx])
          def cstr(data,i):return data[i:data.index(b"\0",i)].decode(errors="replace")
          section_names=[cstr(strings,s[0]) for s in sections]
          slots=[]
          for section in sections:
              if section[1]!=2:continue # SHT_SYMTAB
              strtab=section_bytes(sections[section[6]])
              for off in range(section[4],section[4]+section[5],section[9]):
                  name,value,size,info,other,ndx=struct.unpack_from("<IIIBBH",elf,off)
                  label=cstr(strtab,name)
                  if "slotsE" in label and size==88 and ndx<len(sections):
                      slots.append(dict(symbol=label,address=hex(value),bytes=size,
                                        section=section_names[ndx],section_type=sections[ndx][1],
                                        flags=sections[ndx][2]))
          if len(slots)!=1 or slots[0]["section"]!=".rtc_noinit" or slots[0]["section_type"]!=8:
              raise SystemExit("RTC trace slots not verified in NOBITS .rtc_noinit: "+str(slots))
          # NOBITS is a placement check, not proof of retention after reset.
          print("RTC SLOTS",json.dumps(slots))
          dis=Path("report/app.disassembly.txt").read_text()
          blocks={};label=None;body=[]
          def finish():
              if label is not None:blocks[label]=body[:]
          for line in dis.splitlines():
              m=re.match(r"^\s*[0-9a-fA-F]+ <(.+)>:$",line)
              if m:finish();label=m[1];body=[]
              elif label is not None:body.append(line)
          finish()
          families={
              "setup":r"^_Z5setupv",
              "hal":r"StackChanHAL",
              "gfx":r"M5GFX10autodetect",
              "light":r"Light_M5StackCoreS3",
              "unified":r"Power_Class5begin",
              "ext":r"core_s3_output|Power_Class12setExtOutput",
              "trace":r"tpk_boot_|tpktrace|GLOBAL__N_1.*persist",
              "menu":r"stackBootWait|stackBootMenu",
          }
          result={}
          all_ranges={}
          for family,pattern in families.items():
              selected={k:v for k,v in blocks.items() if re.search(pattern,k)}
              all_ranges.update(selected)
              calls=[(k,line) for k,v in selected.items() for line in v
                     if re.search(r"\bcall(?:0|4|8|12)\b.*<[^>]*tpk_boot_mark",line)]
              result[family]={"ranges":len(selected),"direct_marker_calls":len(calls)}
              print("TRACE FAMILY",family,result[family])
              for k,line in calls:print(k,line)
          for family in ("setup","gfx","light","unified","ext","trace"):
              if not result[family]["ranges"]:
                  raise SystemExit("missing linked family: "+family)
          # HAL/menu may be inlined into setup; ext output may be outlined.
          for family in ("gfx","light","unified","ext"):
              if not result[family]["direct_marker_calls"]:
                  raise SystemExit("missing direct trace evidence in "+family)
          mark_ranges=[v for k,v in blocks.items() if k.startswith("tpk_boot_mark")]
          if not mark_ranges:raise SystemExit("missing marker implementation")
          # Review the marker implementation and any outlined persistence
          # helpers, including RTC stores, barriers and all linked calls.
          Path("report/app.boottrace-functions.txt").write_text(
              "\n\n".join(k+"\n"+"\n".join(v) for k,v in all_ranges.items())+"\n")
          print("BEGIN TRACE IMPLEMENTATION")
          for k,v in all_ranges.items():
              if re.search(r"tpk_boot_mark|GLOBAL__N_1.*persist",k):print(k+"\n"+"\n".join(v))
          print("END TRACE IMPLEMENTATION")
          recovery=struct.pack("<20I",30000,25000,20000,16000,13000,10000,8000,6000,
                               5000,4000,3000,2500,2000,1500,1200,1000,800,600,400,300)
          phoff=struct.unpack_from("<I",elf,28)[0]
          entsize,count=struct.unpack_from("<HH",elf,42)
          tables=[]
          for i in range(count):
              t,o,v,p,fs,ms,fl,al=struct.unpack_from("<8I",elf,phoff+i*entsize)
              if t!=1:continue
              data=elf[o:o+fs];start=0
              while True:
                  j=data.find(recovery,start)
                  if j<0:break
                  tables.append(hex(v+j));start=j+1
          if not tables or recovery not in image:
              raise SystemExit("missing recovery table in loadable ELF or image")
          report=dict(rtc_slots=slots,families=result,recovery_tables=tables,
                      retention_attested=False,electrical_safety_attested=False,
                      flash_authorized=False,manual_control_flow_review_pending=True)
          Path("report/boottrace-audit.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stackchan-6d1b218-exact-ELF-disassembly-NOT-FOR-FLASH
          path: /tmp/k151-review/report/
          if-no-files-found: error
          retention-days: 14
