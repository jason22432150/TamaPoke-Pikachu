name: StackChan diagnostic CI
on:
  push:
    branches: [stackchan]
  pull_request:
    branches: [stackchan]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stackchan-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [run, asan]
    steps:
      - uses: actions/checkout@v4
      - run: make -C TamaPoke/test CXX=g++ ${{ matrix.target }}
      - run: g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=undefined boards/stackchan/test_coordinates.cpp -o /tmp/coordinates && /tmp/coordinates
      - run: g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=undefined boards/stackchan/test_body_policy.cpp -o /tmp/body_policy && /tmp/body_policy
      - run: g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=undefined boards/stackchan/test_motion_policy.cpp -o /tmp/motion_policy && /tmp/motion_policy
      - name: Test Traditional Chinese localization
        run: CXXFLAGS="-std=c++17 -O1 -g -Wall -Wextra -Wno-unused-parameter -fno-omit-frame-pointer -DTPK_ENABLE_ZH_TW=1" make -C TamaPoke/test CXX=g++ BUILD=build-zh ${{ matrix.target }}
      - run: g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=undefined boards/stackchan/test_sidebar_policy.cpp -o /tmp/sidebar_policy && /tmp/sidebar_policy
      - run: g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=undefined boards/stackchan/test_servo_diagnostic.cpp -o /tmp/servo_diagnostic && /tmp/servo_diagnostic
      - run: g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=undefined boards/stackchan/test_servo_coordinates.cpp -o /tmp/servo_coordinates && /tmp/servo_coordinates
      - run: g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=undefined boards/stackchan/test_servo_executor.cpp -o /tmp/servo_executor && /tmp/servo_executor
      - run: g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=undefined boards/stackchan/test_servo_power_session.cpp -o /tmp/servo_power_session && /tmp/servo_power_session
      - run: g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=undefined boards/stackchan/test_sd_upload_policy.cpp -o /tmp/sd_upload && /tmp/sd_upload
      - run: g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=undefined boards/stackchan/test_servo_reaction_session.cpp -o /tmp/servo_reaction && /tmp/servo_reaction
      - run: g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=undefined boards/stackchan/test_perf_policy.cpp -o /tmp/perf_policy && /tmp/perf_policy
      - run: g++ -std=c++11 -Wall -Wextra -Werror -fsanitize=undefined boards/stackchan/test_nvs_guard.cpp -o /tmp/nvs_guard && /tmp/nvs_guard
      - run: python3 tools/test_stackchan_perf_report.py
      - run: python3 tools/test_stackchan_backup.py
      - run: python3 tools/test_stackchan_review.py
      - run: python3 tools/test_stackchan_package.py
      - run: python3 tools/test_stackchan_merge.py
      - run: python3 tools/test_stackchan_impact.py
      - run: python3 tools/test_stackchan_preflight.py
      - run: python3 tools/test_stackchan_efuse_policy.py
      - run: python3 tools/test_stackchan_efuse.py
      - run: python3 tools/test_stackchan_deploy_review.py
      - run: python3 tools/test_stackchan_flash.py
      - run: python3 tools/check_stackchan_partitions.py
      - run: python3 tools/generate_embedded.py --check
  diagnostic:
    runs-on: ubuntu-latest
    needs: host
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install pinned dependencies
        run: |
          source boards/stackchan/versions.env
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install "esp32:esp32@$ESP32_VERSION" --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install --no-deps "M5GFX@$M5GFX_VERSION" "M5Unified@$M5UNIFIED_VERSION"
          python3 tools/patch_stackchan_m5gfx.py "$(arduino-cli config get directories.user)/libraries/M5GFX"
          python3 tools/patch_stackchan_m5gfx.py "$(arduino-cli config get directories.user)/libraries/M5GFX" --check
          arduino-cli lib install "U8g2@$U8G2_VERSION"
          # StackChan uses the upstream Arduino 4 compatibility fix; keep Waveshare on its released dependency.
          GFX_DIR="$(arduino-cli config get directories.user)/libraries/Arduino_GFX"
          mkdir -p "$(dirname "$GFX_DIR")"
          git init "$GFX_DIR"
          git -C "$GFX_DIR" remote add origin https://github.com/moononournation/Arduino_GFX.git
          git -C "$GFX_DIR" fetch --depth 1 origin "$STACKCHAN_GFX_COMMIT"
          git -C "$GFX_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$GFX_DIR" rev-parse HEAD)" = "$STACKCHAN_GFX_COMMIT"
          arduino-cli lib list
      - run: bash tools/build_stackchan.sh
      - name: Compile original game core against StackChan adapters
        run: bash tools/build_stackchan_core_probe.sh
      - name: Fetch pinned official StackChan-BSP
        uses: actions/checkout@v4
        with:
          repository: m5stack/StackChan-BSP
          ref: f7ed40e6f5d9a1d08440cb926f3a0865b81882f8
          path: .deps/stackchan-bsp
          persist-credentials: false
      - name: Fetch pinned U8g2 font source
        uses: actions/checkout@v4
        with:
          repository: olikraus/u8g2
          ref: 46b7f48bcb7bde787d214352873fba9baeccfb71
          path: .deps/u8g2
          persist-credentials: false
      - name: Compile full K151 game
        run: bash tools/build_stackchan_game.sh --ci-candidate "$RUNNER_TEMP/stackchan-alpha-0.1.0"
      - uses: actions/upload-artifact@v4
        with:
          name: stackchan-K151-game-compile-evidence-NOT-FOR-FLASH
          path: |
            build/stackchan-game-review/*.json
            build/stackchan-game-review/TamaPoke.ino.elf
            build/stackchan-game-review/TamaPoke.ino.map
            build/stackchan-game-review/sdkconfig
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: stackchan-alpha-0.1.0-NOT-FOR-FLASH
          path: ${{ runner.temp }}/stackchan-alpha-0.1.0/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: stackchan-K151-diagnostic-NOT-FOR-FLASH
          path: build/stackchan-smoke/
          if-no-files-found: error
  source-bootloader:
    runs-on: ubuntu-latest
    needs: host
    container:
      image: espressif/idf:v6.1.1
    steps:
      - uses: actions/checkout@v4
      - name: Compile source bootloader reference only
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$IDF_PATH"
          source "$IDF_PATH/export.sh"
          bash tools/build_stackchan_bootloader.sh "$RUNNER_TEMP/stackchan-source-bootloader"
      - uses: actions/upload-artifact@v4
        with:
          name: stackchan-source-bootloader-NOT-FOR-FLASH
          path: ${{ runner.temp }}/stackchan-source-bootloader/
          if-no-files-found: error
  paired-alpha:
    runs-on: ubuntu-latest
    needs: [diagnostic, source-bootloader, waveshare-regression]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stackchan-alpha-0.1.0-NOT-FOR-FLASH
          path: ${{ runner.temp }}/arduino-candidate
      - uses: actions/download-artifact@v4
        with:
          name: stackchan-K151-game-compile-evidence-NOT-FOR-FLASH
          path: ${{ runner.temp }}/arduino-evidence
      - uses: actions/download-artifact@v4
        with:
          name: stackchan-source-bootloader-NOT-FOR-FLASH
          path: ${{ runner.temp }}/source-bootloader
      - name: Verify exact linked review inputs
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"arduino-evidence"
          evidence=json.loads((root/"boot-evidence.json").read_text())
          expected={
              "TamaPoke.ino.elf":evidence["application_efuse_symbols"]["elf_sha256"],
              "TamaPoke.ino.map":evidence["app_map_sha256"],
              "sdkconfig":evidence["sdk_config_sha256"],
          }
          for name,digest in expected.items():
              if hashlib.sha256((root/name).read_bytes()).hexdigest()!=digest:
                  raise SystemExit("review input digest mismatch: "+name)
          print("Exact application ELF, linker map and SDK configuration verified.")
          PY
      - name: Pair the same-commit source bootloader and application
        run: |
          python3 tools/stackchan_package.py combine \
            --candidate "$RUNNER_TEMP/arduino-candidate" \
            --source-bootloader "$RUNNER_TEMP/source-bootloader" \
            --arduino-evidence "$RUNNER_TEMP/arduino-evidence/boot-evidence.json" \
            --out "$RUNNER_TEMP/paired-alpha" \
            --report "$RUNNER_TEMP/paired-evidence.json"
          python3 tools/stackchan_package.py verify --out "$RUNNER_TEMP/paired-alpha"
      - uses: actions/upload-artifact@v4
        with:
          name: stackchan-alpha-0.1.0-source-bootloader-NOT-FOR-FLASH
          path: ${{ runner.temp }}/paired-alpha/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: stackchan-alpha-paired-evidence-NOT-FOR-FLASH
          path: ${{ runner.temp }}/paired-evidence.json
          if-no-files-found: error
  waveshare-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install original release dependencies
        run: |
          source boards/stackchan/versions.env
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install "esp32:esp32@$WAVESHARE_ESP32_VERSION" --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "GFX Library for Arduino@$ARDUINO_GFX_VERSION" "U8g2@$U8G2_VERSION" "SensorLib@$WAVESHARE_SENSORLIB_VERSION" "XPowersLib@$WAVESHARE_XPOWERS_VERSION"
      - name: Compile original Waveshare firmware
        run: bash tools/build.sh
